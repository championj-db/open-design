# Databricks Apps spec for OpenDesign.
# See docs/databricks-native/README.md for the deployment model.
#
# pnpm workspaces need an explicit command. The daemon serves both /api/* and
# the static web export (apps/web/out), so it is the only process.
# Databricks injects PORT / DATABRICKS_APP_PORT; the daemon reads them and
# binds 0.0.0.0 when they are set.
command: ["node", "apps/daemon/dist/cli.js", "--no-open"]

# Auth: every /api/* request is authenticated on behalf of the signed-in user
# (OBO). The app MUST have user authorization enabled so the Apps proxy
# forwards X-Forwarded-Access-Token; without it every API call is a 401.
# Scopes: the daemon resolves the user through SCIM Me, which needs the
# default user identity scope; add scopes for any user-facing data/AI calls as
# later waves introduce them. Do NOT set OD_LOCAL_DEV_USER here: it is a
# local-development bypass and the daemon refuses to start with it in an app.
#
# Browser origin: the app's own https://<app>.databricksapps.com origin is
# accepted automatically (DATABRICKS_APP_URL, or same-origin requests through
# the Apps proxy). Only list additional origins in OD_ALLOWED_ORIGINS.
env:
  - name: NODE_ENV
    value: "production"
  # Wave 2: Lakebase (Postgres). Attach the Lakebase database as an app
  # resource so Databricks injects PGHOST / PGPORT / PGDATABASE / PGUSER /
  # PGSSLMODE, then name the endpoint the OAuth DB credential is minted for.
  # See docs/databricks-native/README.md ("Database").
  # - name: LAKEBASE_ENDPOINT
  #   value: "projects/<project>/branches/<branch>/endpoints/<endpoint>"
