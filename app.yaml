# Databricks Apps spec for OpenDesign.
# See docs/databricks-native/README.md for the deployment model.
#
# pnpm workspaces need an explicit command. The daemon serves both /api/* and
# the static web export (apps/web/out), so it is the only process.
# Databricks injects PORT / DATABRICKS_APP_PORT; the daemon reads them and
# binds 0.0.0.0 when they are set.
command: ["node", "apps/daemon/dist/cli.js", "--no-open"]

env:
  # On-behalf-of auth: every /api request must carry the signed-in user's
  # X-Forwarded-Access-Token, verified against SCIM Me (fail closed). Replaces
  # OD_API_TOKEN / OD_DISABLE_API_AUTH, accepts the app's own origin natively,
  # skips the first-run onboarding, and disables external sign-in flows.
  # Requires user authorization on the app with at least the
  # iam.current-user:read user API scope.
  - name: OD_AUTH_MODE
    value: "databricks"
  - name: NODE_ENV
    value: "production"
  # The container disk is wiped on every deploy, so the daemon data root is
  # mirrored to this Unity Catalog volume: restored at startup, synced while
  # running. `persistent_storage` is the app's volume resource key (Can read
  # and write). The daemon refuses to start if the volume cannot be read.
  - name: OD_DATA_VOLUME
    valueFrom: persistent_storage
  # Gives the Databricks agent a Bash tool in an ephemeral Databricks Sandbox
  # (Beta), one per user conversation, owned by the app's service principal
  # and deleted once idle. Needs the Sandbox preview in the workspace and
  # sandbox access for the service principal; without them the agent keeps
  # the file tools only.
  - name: OD_DATABRICKS_SANDBOX
    value: "1"
  # The Model Serving endpoint the Databricks agent's "Default" model resolves
  # to. Users who picked a specific model keep it.
  - name: OD_DATABRICKS_DEFAULT_MODEL
    value: "databricks-claude-opus-5-5"
